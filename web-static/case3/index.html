<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>case3 DT for Comm — Gate 1.5 Static</title>
  <link rel="stylesheet" href="../../04-runtime-assets/shell/tokens.css" />
  <link rel="stylesheet" href="../shared/site-env-window.css" />
  <link rel="stylesheet" href="./case3.css" />
</head>
<body>
  <div class="stage-viewport">
    <div class="stage" id="stage">
      <header class="shell-header" data-layer="ShellHeader">
        <div class="nav-bg" aria-hidden="true"></div>
        <div class="brand-area">
          <img class="brand-logo" src="../../04-runtime-assets/shell/brand-logo.png" width="32" height="32" alt="" />
          <span class="brand-sub">云上外场</span>
          <span class="brand-title">IMT-2030 DT测试</span>
        </div>
        <nav class="case-nav" aria-label="Case tabs">
          <button type="button" class="case-tab" data-tab="case1">
            <span class="case-tab__label">DT Construction</span>
            <span class="tab-underline" aria-hidden="true"></span>
          </button>
          <button type="button" class="case-tab" data-tab="case2">
            <span class="case-tab__label">DT Calibration</span>
            <span class="tab-underline" aria-hidden="true"></span>
          </button>
          <button type="button" class="case-tab is-active" data-tab="case3">
            <span class="case-tab__label">DT for Comm</span>
            <span class="tab-underline" aria-hidden="true"></span>
          </button>
          <button type="button" class="case-tab" data-tab="case4">
            <span class="case-tab__label">DT for positioning</span>
            <span class="tab-underline" aria-hidden="true"></span>
          </button>
        </nav>
      </header>

      <section class="placeholder-page" id="placeholder-page" hidden>
        <p>建设中</p>
      </section>

      <main class="case3-page" id="case3-page" data-state="initial">
        <div class="case3-page__bg" aria-hidden="true"></div>

        <section class="case3-test-panel">
          <div class="case3-panel-title-row">
            <div class="case3-title-group">
              <span class="case3-title-accent" aria-hidden="true"></span>
              <h2 class="case3-panel-title">测试对比</h2>
            </div>
            <a class="case3-env-link" href="#" data-site-env-trigger>现场环境 &gt;</a>
          </div>

          <div class="case3-side-pair">
            <!-- Without DT -->
            <article class="case3-side" data-side="without">
              <div class="case3-side-header">
                <div class="case3-side-label-group">
                  <img class="case3-side-icon" src="./assets/icon-without.png" width="24" height="24" alt="" />
                  <span class="case3-side-label">无 DT</span>
                  <span class="case3-status-badge" data-badge="without">
                    <span class="case3-status-text" data-badge-text="without">等待启动测试</span>
                  </span>
                </div>
                <div class="case3-side-actions">
                  <button type="button" class="case3-btn case3-btn--start" data-action="start-without" title="启动（验收切换）">
                    <svg class="case3-btn__icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M5 3v18l15-9L5 3z" fill="currentColor" />
                    </svg>
                    <span>启动</span>
                  </button>
                  <button type="button" class="case3-btn case3-btn--reset" data-action="reset-without" title="重置（验收切换）" disabled>
                    <svg class="case3-btn__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      <path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>重置</span>
                  </button>
                </div>
              </div>

              <div class="case3-map-stage">
                <img class="case3-map-img" src="./assets/ue_comm_map.png" alt="" />
                <div class="case3-route-layer" data-route="without" aria-hidden="true"></div>

                <div class="case3-beam-card case3-beam-card--scan" data-beam="without">
                  <div class="case3-beam-card__head">
                    <div class="case3-beam-card__title-group">
                      <img src="./assets/icon-bs-beam.png" width="20" height="20" alt="" />
                      <span>BS波束</span>
                    </div>
                    <div class="case3-beam-card__point" data-beam-point-wrap="without" hidden>
                      <img src="./assets/icon-point.png" width="12" height="12" alt="" />
                      <span data-beam-point="without">点位{no}</span>
                    </div>
                  </div>
                  <div class="case3-scan-grid-bg">
                    <div class="case3-scan-grid" data-scan-grid="without"></div>
                  </div>
                  <div class="case3-beam-legend">
                    <span class="case3-beam-legend__item case3-beam-legend__item--best">最优波束</span>
                    <span class="case3-beam-legend__item case3-beam-legend__item--scan">扫描波束</span>
                  </div>
                </div>

                <div class="case3-progress" data-progress="without">
                  <div class="case3-progress__title">点位进度</div>
                  <div class="case3-progress__slots" data-progress-slots="without"></div>
                </div>
              </div>
            </article>

            <!-- With DT -->
            <article class="case3-side" data-side="with">
              <div class="case3-side-header">
                <div class="case3-side-label-group">
                  <img class="case3-side-icon" src="./assets/icon-with.png" width="24" height="24" alt="" />
                  <span class="case3-side-label">有 DT</span>
                  <span class="case3-status-badge" data-badge="with">
                    <span class="case3-status-text" data-badge-text="with">等待无DT测试完成</span>
                  </span>
                </div>
                <div class="case3-side-actions">
                  <button type="button" class="case3-btn case3-btn--start" data-action="start-with" title="需先完成无 DT" disabled>
                    <svg class="case3-btn__icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M5 3v18l15-9L5 3z" fill="currentColor" />
                    </svg>
                    <span>启动</span>
                  </button>
                  <button type="button" class="case3-btn case3-btn--reset" data-action="reset-with" title="重置（验收切换）" disabled>
                    <svg class="case3-btn__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      <path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>重置</span>
                  </button>
                </div>
              </div>

              <div class="case3-map-stage">
                <img class="case3-map-img" src="./assets/ue_comm_map.png" alt="" />
                <div class="case3-route-layer" data-route="with" aria-hidden="true"></div>

                <div class="case3-beam-card case3-beam-card--scan" data-beam="with">
                  <div class="case3-beam-card__head">
                    <div class="case3-beam-card__title-group">
                      <img src="./assets/icon-bs-beam.png" width="20" height="20" alt="" />
                      <span>BS波束</span>
                    </div>
                    <div class="case3-beam-card__point" data-beam-point-wrap="with" hidden>
                      <img src="./assets/icon-point.png" width="12" height="12" alt="" />
                      <span data-beam-point="with">点位2</span>
                    </div>
                  </div>
                  <div class="case3-scan-grid-bg">
                    <div class="case3-scan-grid" data-scan-grid="with"></div>
                  </div>
                  <div class="case3-beam-legend" data-beam-legend="with" hidden>
                    <span class="case3-beam-legend__item case3-beam-legend__item--predict" data-with-legend>
                      <img class="case3-beam-legend__icon" data-with-legend-icon src="./assets/icon-ok.png" width="14" height="14" alt="" />
                      <span data-with-legend-text>波束预测成功,BeamId:2</span>
                    </span>
                  </div>
                </div>

                <div class="case3-progress" data-progress="with">
                  <div class="case3-progress__title">点位进度</div>
                  <div class="case3-progress__slots" data-progress-slots="with"></div>
                </div>
              </div>
            </article>
          </div>
        </section>

        <section class="case3-kpi-panel">
          <div class="case3-kpi-title-row">
            <span class="case3-title-accent" aria-hidden="true"></span>
            <h2 class="case3-panel-title">KPI对比</h2>
          </div>

          <div class="case3-kpi-cols">
            <!-- Cost -->
            <article class="case3-kpi-card case3-cost-card">
              <div class="case3-kpi-card__head">
                <img class="case3-kpi-card__icon case3-kpi-card__icon--cost" src="./assets/icon-cost-thrp.png" width="24" height="24" alt="" />
                <h3>开销(%)</h3>
              </div>
              <div class="case3-cost-body">
                <div class="case3-cost-gauge case3-cost-gauge--without" data-cost-side="without">
                  <svg class="case3-cost-arc" viewBox="0 0 132 132" aria-hidden="true">
                    <defs>
                      <linearGradient id="case3-cost-grad-wo" x1="66" y1="124" x2="66" y2="8" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ffffff1a" />
                        <stop offset="60%" stop-color="#ffffff" />
                      </linearGradient>
                      <filter id="case3-cost-blur-wo" x="-80%" y="-80%" width="260%" height="260%">
                        <feGaussianBlur stdDeviation="3" />
                      </filter>
                      <filter id="case3-cost-shadow-wo" x="-80%" y="-80%" width="260%" height="260%">
                        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFFFFF44" />
                      </filter>
                    </defs>
                    <!-- Same right-arc path as with-side; CSS scaleX(-1) mirrors to left — identical radius -->
                    <path class="case3-cost-arc__track" d="M66 8 A58 58 0 0 1 66 124" />
                    <path class="case3-cost-arc__glow" data-cost-glow="without" filter="url(#case3-cost-blur-wo)" d="M66 124 A58 58 0 0 0 66 8" />
                    <path class="case3-cost-arc__value" data-cost-arc="without" filter="url(#case3-cost-shadow-wo)" stroke="url(#case3-cost-grad-wo)" d="M66 124 A58 58 0 0 0 66 8" />
                  </svg>
                  <div class="case3-cost-readout">
                    <div class="case3-cost-readout__row">
                      <span class="case3-cost-value" data-cost-value="without">--</span>
                      <span class="case3-cost-unit">%</span>
                    </div>
                    <div class="case3-cost-side-label">无 DT</div>
                  </div>
                  <span class="case3-cost-tick case3-cost-tick--0">0</span>
                  <span class="case3-cost-tick case3-cost-tick--100">100</span>
                </div>

                <div class="case3-cost-delta">
                  <div class="case3-cost-delta__pill">
                    <span class="case3-cost-delta__arrow" data-cost-arrow hidden>↓</span>
                    <span class="case3-cost-delta__value" data-cost-delta>--</span>
                    <span class="case3-cost-delta__unit">%</span>
                  </div>
                  <div class="case3-cost-delta__label">开销变化</div>
                </div>

                <div class="case3-cost-gauge case3-cost-gauge--with" data-cost-side="with">
                  <svg class="case3-cost-arc" viewBox="0 0 132 132" aria-hidden="true">
                    <defs>
                      <linearGradient id="case3-cost-grad-w" x1="66" y1="124" x2="124" y2="66" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#5036ea" />
                        <stop offset="100%" stop-color="#b07def" />
                      </linearGradient>
                      <filter id="case3-cost-blur-w" x="-80%" y="-80%" width="260%" height="260%">
                        <feGaussianBlur stdDeviation="3" />
                      </filter>
                      <filter id="case3-cost-shadow-w" x="-80%" y="-80%" width="260%" height="260%">
                        <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8B5CF666" />
                      </filter>
                    </defs>
                    <!-- Pencil qCTzF path flipX of left-arc → right arc -->
                    <path class="case3-cost-arc__track" d="M66 8 A58 58 0 0 1 66 124" />
                    <path class="case3-cost-arc__glow case3-cost-arc__glow--with" data-cost-glow="with" filter="url(#case3-cost-blur-w)" d="M66 124 A58 58 0 0 0 66 8" />
                    <path class="case3-cost-arc__value case3-cost-arc__value--with" data-cost-arc="with" filter="url(#case3-cost-shadow-w)" stroke="url(#case3-cost-grad-w)" d="M66 124 A58 58 0 0 0 66 8" />
                  </svg>
                  <div class="case3-cost-readout">
                    <div class="case3-cost-readout__row">
                      <span class="case3-cost-value" data-cost-value="with">--</span>
                      <span class="case3-cost-unit">%</span>
                    </div>
                    <div class="case3-cost-side-label">有 DT</div>
                  </div>
                  <span class="case3-cost-tick case3-cost-tick--0">0</span>
                  <span class="case3-cost-tick case3-cost-tick--100">100</span>
                </div>
              </div>
            </article>

            <!-- Throughput -->
            <article class="case3-kpi-card case3-thrp-card">
              <div class="case3-kpi-card__head">
                <span class="case3-kpi-card__icon case3-kpi-card__icon--thrp" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z" fill="currentColor" />
                  </svg>
                </span>
                <h3>吞吐(Gbps)</h3>
              </div>
              <div class="case3-thrp-legend">
                <span class="case3-thrp-legend__item case3-thrp-legend__item--wo">无 DT</span>
                <span class="case3-thrp-legend__item case3-thrp-legend__item--w">有 DT</span>
              </div>
              <div class="case3-thrp-plot" aria-hidden="true">
                <svg class="case3-thrp-svg" viewBox="0 0 596 242" preserveAspectRatio="xMidYMid meet">
                  <g class="case3-thrp-grid" fill="#ffffff14" stroke="none">
                    <!-- Y grid 0..10 -->
                    <rect x="36" y="12" width="544" height="1" />
                    <rect x="36" y="31.8" width="544" height="1" />
                    <rect x="36" y="51.6" width="544" height="1" />
                    <rect x="36" y="71.4" width="544" height="1" />
                    <rect x="36" y="91.2" width="544" height="1" />
                    <rect x="36" y="111" width="544" height="1" />
                    <rect x="36" y="130.8" width="544" height="1" />
                    <rect x="36" y="150.6" width="544" height="1" />
                    <rect x="36" y="170.4" width="544" height="1" />
                    <rect x="36" y="190.2" width="544" height="1" />
                    <rect x="36" y="210" width="544" height="1" />
                    <!-- X grid 1..20 -->
                    <rect x="36" y="12" width="1" height="198" />
                    <rect x="64.6" y="12" width="1" height="198" />
                    <rect x="93.3" y="12" width="1" height="198" />
                    <rect x="121.9" y="12" width="1" height="198" />
                    <rect x="150.5" y="12" width="1" height="198" />
                    <rect x="179.2" y="12" width="1" height="198" />
                    <rect x="207.8" y="12" width="1" height="198" />
                    <rect x="236.4" y="12" width="1" height="198" />
                    <rect x="265.1" y="12" width="1" height="198" />
                    <rect x="293.7" y="12" width="1" height="198" />
                    <rect x="322.3" y="12" width="1" height="198" />
                    <rect x="350.9" y="12" width="1" height="198" />
                    <rect x="379.6" y="12" width="1" height="198" />
                    <rect x="408.2" y="12" width="1" height="198" />
                    <rect x="436.8" y="12" width="1" height="198" />
                    <rect x="465.5" y="12" width="1" height="198" />
                    <rect x="494.1" y="12" width="1" height="198" />
                    <rect x="522.7" y="12" width="1" height="198" />
                    <rect x="551.4" y="12" width="1" height="198" />
                    <rect x="580" y="12" width="1" height="198" />
                  </g>
                  <g class="case3-thrp-ylabels" fill="#939393" font-size="9" font-weight="400" font-family="Inter, sans-serif">
                    <text x="28" y="214" text-anchor="end">0</text>
                    <text x="28" y="194.2" text-anchor="end">1</text>
                    <text x="28" y="174.4" text-anchor="end">2</text>
                    <text x="28" y="154.6" text-anchor="end">3</text>
                    <text x="28" y="134.8" text-anchor="end">4</text>
                    <text x="28" y="115" text-anchor="end">5</text>
                    <text x="28" y="95.2" text-anchor="end">6</text>
                    <text x="28" y="75.4" text-anchor="end">7</text>
                    <text x="28" y="55.6" text-anchor="end">8</text>
                    <text x="28" y="35.8" text-anchor="end">9</text>
                    <text x="28" y="16" text-anchor="end">10</text>
                  </g>
                  <g class="case3-thrp-xlabels" fill="#939393" font-size="9" font-weight="400" font-family="Inter, sans-serif">
                    <text x="36" y="232" text-anchor="middle">1</text>
                    <text x="64.6" y="232" text-anchor="middle">2</text>
                    <text x="93.3" y="232" text-anchor="middle">3</text>
                    <text x="121.9" y="232" text-anchor="middle">4</text>
                    <text x="150.5" y="232" text-anchor="middle">5</text>
                    <text x="179.2" y="232" text-anchor="middle">6</text>
                    <text x="207.8" y="232" text-anchor="middle">7</text>
                    <text x="236.4" y="232" text-anchor="middle">8</text>
                    <text x="265.1" y="232" text-anchor="middle">9</text>
                    <text x="293.7" y="232" text-anchor="middle">10</text>
                    <text x="322.3" y="232" text-anchor="middle">11</text>
                    <text x="350.9" y="232" text-anchor="middle">12</text>
                    <text x="379.6" y="232" text-anchor="middle">13</text>
                    <text x="408.2" y="232" text-anchor="middle">14</text>
                    <text x="436.8" y="232" text-anchor="middle">15</text>
                    <text x="465.5" y="232" text-anchor="middle">16</text>
                    <text x="494.1" y="232" text-anchor="middle">17</text>
                    <text x="522.7" y="232" text-anchor="middle">18</text>
                    <text x="551.4" y="232" text-anchor="middle">19</text>
                    <text x="580" y="232" text-anchor="middle">20</text>
                  </g>
                  <polyline class="case3-thrp-line case3-thrp-line--wo" data-thrp-line="without" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="" />
                  <polyline class="case3-thrp-line case3-thrp-line--w" data-thrp-line="with" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="" />
                  <g data-thrp-dots="without"></g>
                  <g data-thrp-dots="with"></g>
                </svg>
              </div>
            </article>

            <!-- Beam Accuracy -->
            <article class="case3-kpi-card case3-ba-card">
              <div class="case3-kpi-card__head">
                <img class="case3-kpi-card__icon case3-kpi-card__icon--ba" src="./assets/icon-predict.png" width="24" height="24" alt="" />
                <h3>波束预测准确率</h3>
              </div>
              <div class="case3-ba-body">
                <img class="case3-ba-slot-bg" src="./assets/ba-slot-bg.png" alt="" />
                <div class="case3-ba-count case3-ba-count--ok">
                  <div class="case3-ba-count__value" data-ba-ok>80</div>
                  <div class="case3-ba-count__unit">(次)</div>
                  <div class="case3-ba-count__label-row">
                    <img src="./assets/icon-ok.png" width="16" height="16" alt="" />
                    <span>正确次数</span>
                  </div>
                </div>

                <div class="case3-ba-ring-wrap">
                  <img class="case3-ba-circle-bg" src="./assets/ba-circle-bg.png" alt="" />
                  <div class="case3-ba-ring-comp">
                    <svg class="case3-ba-ring" viewBox="0 0 236 236" aria-hidden="true">
                      <defs>
                        <filter id="case3-ba-glow" x="-40%" y="-40%" width="180%" height="180%">
                          <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#22C55E33" />
                        </filter>
                      </defs>
                      <path class="case3-ba-ring__track" d="M50.23 170.95 A86 86 0 1 1 185.77 170.95" />
                      <path class="case3-ba-ring__value" data-ba-ring filter="url(#case3-ba-glow)" d="M50.23 170.95 A86 86 0 1 1 185.77 170.95" stroke-dasharray="384.29" stroke-dashoffset="0" />
                    </svg>
                    <div class="case3-ba-center">
                      <div class="case3-ba-pct"><span data-ba-pct>100</span></div>
                      <span class="case3-ba-pct__unit">%</span>
                      <div class="case3-ba-caption">预测准确率</div>
                      <div class="case3-ba-badge" data-ba-badge>正常</div>
                    </div>
                  </div>
                </div>

                <div class="case3-ba-count case3-ba-count--err">
                  <div class="case3-ba-count__value" data-ba-err>0</div>
                  <div class="case3-ba-count__unit">(次)</div>
                  <div class="case3-ba-count__label-row">
                    <img src="./assets/icon-err.png" width="16" height="16" alt="" />
                    <span>错误次数</span>
                  </div>
                </div>
              </div>
            </article>
          </div>
        </section>
      </main>

      <aside class="review-dock" aria-label="Gate 1.5 验收状态切换">
        <div class="review-dock__label" data-review-dock-handle title="拖动移动面板">Gate 1.5 评审</div>
        <button type="button" class="review-dock__btn is-active" data-set-state="initial">初始</button>
        <button type="button" class="review-dock__btn" data-set-state="without-running">无DT运行中</button>
        <button type="button" class="review-dock__btn" data-set-state="without-completed">无DT完成</button>
        <button type="button" class="review-dock__btn" data-set-state="with-running">有DT运行中</button>
        <button type="button" class="review-dock__btn" data-set-state="with-completed">有DT完成</button>
      </aside>
    </div>
  </div>

  <script src="../shared/site-env-window.js"></script>
  <script src="./case3.js"></script>
</body>
</html>

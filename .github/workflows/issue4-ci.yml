name: issue4-ci
on:
  push:
    branches: [issue-4-ux-sync]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

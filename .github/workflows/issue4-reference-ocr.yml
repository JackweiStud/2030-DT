name: issue4-reference-export
on:
  push:
    branches: [issue-4-ux-sync]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: issue4-reference-images
          path: |
            01-参考资料/更新/case2/*.png
            01-参考资料/更新/case3/*.png
            01-参考资料/更新/case4/*.png

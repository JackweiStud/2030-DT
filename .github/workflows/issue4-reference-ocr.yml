name: issue4-worktree-export
on:
  push:
    branches: [issue-4-ux-sync]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: issue4-worktree
          path: |
            code/web
            package.json
            package-lock.json
            code/package.json
            code/package-lock.json
